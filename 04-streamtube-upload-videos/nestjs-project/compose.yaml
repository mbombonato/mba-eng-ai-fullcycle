services:
  nestjs-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Video worker (FFmpeg) — consumes the `video-processing` BullMQ queue.
  # Same image/codebase as the API, different entrypoint (src/worker.ts).
  # Needs node_modules installed via `docker compose exec nestjs-api npm install`
  # (shared bind mount); it restarts until the dependencies exist.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "start:worker"]
    restart: unless-stopped
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # Object storage (S3-compatible). The official minio/minio images are no
  # longer published; pgsty/minio is a community build of the same server.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY_ID:-streamtube}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_ACCESS_KEY:-streamtube-secret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the private bucket used for videos and thumbnails.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    entrypoint: ["sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$S3_BUCKET"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY_ID:-streamtube}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_ACCESS_KEY:-streamtube-secret}
      - S3_BUCKET=${S3_BUCKET:-streamtube}
    depends_on:
      minio:
        condition: service_healthy

  # Message queue backend for BullMQ (AOF persistence keeps jobs across restarts).
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  minio-data:
  redis-data:
