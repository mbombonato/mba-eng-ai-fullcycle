[project]
name = "agente-residencial-aurora"
version = "0.1.0"
description = "Assistente virtual do Residencial Aurora (Google ADK + FastAPI)"
authors = [
    { name = "Matheus Bombonato", email = "nom4d3@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "google-adk==2.9.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
aurora-api = "aurora.api:main"
aurora-restaurar = "aurora.restore:main"

[project.optional-dependencies]
openai = [
    "litellm==1.106.3",
    "mcp>=1.10",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.uv.build-backend]
module-name = "aurora"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
